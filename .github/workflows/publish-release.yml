name: Publish self-use release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional unique downstream tag (v0.2610.0-xz.<suffix>); empty derives it from the source SHA'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-manual-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'xz-dev/telegram' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze this integrated main commit
        id: prepare
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release.py prepare --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/source-input" --version "$REQUESTED_VERSION" > "$RUNNER_TEMP/prepared.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/prepared.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("source_sha="+d["source_commit"]+"\nversion="+d["version"]+"\n")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manual-release-source
          path: ${{ runner.temp }}/source-input/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    with:
      source_artifact: manual-release-source
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-linux-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate assets and publish a new immutable prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release.py publish --assets "$RUNNER_TEMP/release-assets" \
            --source-sha "$SOURCE_SHA" --version "$RELEASE_VERSION"
