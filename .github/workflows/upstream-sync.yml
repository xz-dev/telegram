name: 'Upstream Sync'

on:
  schedule:
    # 04:42 UTC daily. Minute picked randomly from 1-59 excluding
    # multiples of 5 per the downstream-fork-maintain skill to avoid the
    # high-load start-of-hour and common 5-minute marks.
    - cron: '42 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync-main-with-squash-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Rebuild main from upstream and squash branches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/mautrix/telegram.git
          git fetch upstream main
          git fetch origin ci patch/relay-sticker-keep-sticker patch/gif-alpha-threshold
          git reset --hard upstream/main

          if ! git merge --squash origin/ci; then
            mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
            if (( ${#conflicts[@]} != 1 )) || [[ ${conflicts[0]} != README.md ]]; then
              printf '::error::Unexpected ci squash conflicts:'
              printf ' %q' "${conflicts[@]}"
              printf '\n'
              exit 1
            fi
          fi
          git restore --source=origin/ci --staged --worktree -- README.md
          if ! git diff --quiet --diff-filter=U --; then
            echo '::error::Unresolved conflicts remain after replacing README.md'
            exit 1
          fi
          git commit -m "merge ci branch"

          git merge --squash origin/patch/relay-sticker-keep-sticker
          git commit -m "merge patch/relay-sticker-keep-sticker branch"

          git merge --squash origin/patch/gif-alpha-threshold
          git commit -m "merge patch/gif-alpha-threshold branch"

      - name: Go build and test
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

      - name: Require sync workflow token
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_WORKFLOW_TOKEN }}
        run: |
          test -n "${PUSH_TOKEN}" || {
            echo "::error::SYNC_WORKFLOW_TOKEN is required because GITHUB_TOKEN pushes do not trigger downstream workflows"
            exit 1
          }

      - name: Push rebuilt main
        env:
          PUSH_TOKEN: ${{ secrets.SYNC_WORKFLOW_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin HEAD:main
